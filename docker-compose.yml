services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      REDIS_URL: redis://redis:6379
      ECOMGEN_DATA_DIR: /app/data
      ECOMGEN_MASTER_KEY: ${ECOMGEN_MASTER_KEY:?Set a base64-encoded 32-byte key in .env}
      # 首次启动创建的站长账号；users 表非空时忽略。
      ECOMGEN_BOOTSTRAP_EMAIL: ${ECOMGEN_BOOTSTRAP_EMAIL:-owner@ecomgen.local}
      ECOMGEN_BOOTSTRAP_PASSWORD: ${ECOMGEN_BOOTSTRAP_PASSWORD:-}
      # 生产走 HTTPS 时置为 true，否则会话 cookie 不带 Secure。
      ECOMGEN_SECURE_COOKIES: ${ECOMGEN_SECURE_COOKIES:-false}
      # 与 worker 必须一致；Compose 只转发这里列出的变量，.env 里改了不写这行是不生效的。
      ECOMGEN_QUEUE_NAME: ${ECOMGEN_QUEUE_NAME:-ecomgen}
      # 前后端分离部署时必须设置，否则浏览器会被 CORS 拦掉。
      ECOMGEN_CORS_ORIGINS: ${ECOMGEN_CORS_ORIGINS:-}
      # 反代后必须设置（单层 Nginx 填 1），否则 request.ip 恒为代理地址，
      # 所有用户共享同一个登录限流桶。代码会拒绝 "true"，只接受跳数或地址列表。
      ECOMGEN_TRUST_PROXY: ${ECOMGEN_TRUST_PROXY:-}
      # Provider 返回的图片 URL 会做 SSRF 校验；仅自建内网 Provider 才需打开。
      ECOMGEN_ALLOW_PRIVATE_PROVIDER_URLS: ${ECOMGEN_ALLOW_PRIVATE_PROVIDER_URLS:-false}
    ports:
      - "8787:8787"
    volumes:
      - ecomgen_data:/app/data

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "apps/worker/dist/worker.js"]
    # 镜像自带的 HEALTHCHECK 探的是 API 的 /health；worker 不起 HTTP 服务，
    # 继承这个探针会让它永远 unhealthy。worker 的存活通过日志里的
    # "ecomgen worker ready" 与队列消费情况观测。
    healthcheck:
      disable: true
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379
      ECOMGEN_DATA_DIR: /app/data
      ECOMGEN_MASTER_KEY: ${ECOMGEN_MASTER_KEY:?Set a base64-encoded 32-byte key in .env}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      ECOMGEN_ALLOW_PRIVATE_PROVIDER_URLS: ${ECOMGEN_ALLOW_PRIVATE_PROVIDER_URLS:-false}
      ECOMGEN_QUEUE_NAME: ${ECOMGEN_QUEUE_NAME:-ecomgen}
      WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-900000}
    volumes:
      - ecomgen_data:/app/data

volumes:
  ecomgen_data:
  redis_data:
